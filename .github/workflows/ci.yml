name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Reclaim disk space for IDE verification
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/local/.ghcup \
            /usr/share/dotnet \
            /opt/hostedtoolcache/CodeQL
          docker system prune --all --force || true
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read JDK version
        id: jdk
        run: echo "version=$(grep '^jdkVersion=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: zulu
          java-version: ${{ steps.jdk.outputs.version }}
      - name: Shellcheck release scripts
        run: shellcheck scripts/validate-release.sh scripts/validate-release-test.sh
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Verify release candidate
        run: ./gradlew --dependency-verification=strict clean verifyReleaseCandidate
      - name: Rehearse plugin signing with an ephemeral non-production certificate
        run: |
          set -euo pipefail

          mkdir -p build/signing
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 \
            -aes-256-cbc -pass pass:ci-signing-test -out build/signing/private.pem
          openssl req -new -x509 -sha256 -days 1 \
            -key build/signing/private.pem -passin pass:ci-signing-test \
            -subj '/CN=Alarm and Timer CI signing rehearsal/' -out build/signing/chain.crt
          PRIVATE_KEY_PASSWORD=ci-signing-test \
            ./gradlew --offline --dependency-verification=strict --no-daemon signPlugin verifyPluginSignature
      - name: Remove ephemeral signing-rehearsal material
        if: always()
        run: rm -f build/signing/chain.crt build/signing/private.pem build/distributions/*-signed.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: alarm-and-timer-plugin
          path: build/distributions/*.zip
          if-no-files-found: error
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-reports
          path: build/reports/
