name: Build, sign, and publish GitHub release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build:
    if: github.repository_owner == 'onlinealarmkur' && github.actor == 'ozdemirburak'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Reclaim disk space for IDE verification
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/local/.ghcup \
            /usr/share/dotnet \
            /opt/hostedtoolcache/CodeQL
          docker system prune --all --force || true
          df -h /
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release tag belongs to main
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$GITHUB_REF_NAME" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Unexpected release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          if ! git show-ref --verify --quiet refs/remotes/origin/main; then
            echo "The fetched origin/main ref is unavailable." >&2
            exit 1
          fi

          tag_commit="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          checked_out_commit="$(git rev-parse HEAD)"
          if [[ "$tag_commit" != "$checked_out_commit" ]]; then
            echo "The checkout does not match tagged commit $tag_commit." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main; then
            echo "Tagged commit $tag_commit does not belong to main." >&2
            exit 1
          fi

          version="$GITHUB_REF_NAME"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Test release validator
        run: scripts/validate-release-test.sh
      - name: Validate tagged release identity
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: scripts/validate-release.sh tagged-identity "$RELEASE_VERSION"
      - name: Read JDK version
        id: jdk
        run: echo "version=$(grep '^jdkVersion=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: zulu
          java-version: ${{ steps.jdk.outputs.version }}
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Verify release candidate
        run: ./gradlew --dependency-verification=strict clean verifyReleaseCandidate
      - name: Locate and checksum verified ZIP
        id: release-archive
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          archive="$(scripts/validate-release.sh archive "$RELEASE_VERSION" unsigned)"
          checksum="${archive}.sha256"
          (
            cd "$(dirname "$archive")"
            sha256sum "$(basename "$archive")" > "$(basename "$checksum")"
            sha256sum --check "$(basename "$checksum")"
          )
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
      - name: Attest verified unsigned input
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ steps.release-archive.outputs.archive }}
            ${{ steps.release-archive.outputs.checksum }}
      - name: Transfer verified unsigned input to signing job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-unsigned-plugin-${{ github.sha }}
          path: |
            ${{ steps.release-archive.outputs.archive }}
            ${{ steps.release-archive.outputs.checksum }}
          if-no-files-found: error
          retention-days: 1

  sign:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: plugin-signing
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read JDK version
        id: jdk
        run: echo "version=$(grep '^jdkVersion=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: zulu
          java-version: ${{ steps.jdk.outputs.version }}
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Download verified unsigned input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-unsigned-plugin-${{ github.sha }}
          path: build/distributions
      - name: Verify exact unsigned input
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail

          archive="jetbrains-${RELEASE_VERSION}.zip"
          checksum="${archive}.sha256"
          actual="$(find build/distributions -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort)"
          expected="$(printf '%s\n' "$archive" "$checksum" | LC_ALL=C sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo "Signing input does not match the verified ZIP and checksum pair." >&2
            printf 'Expected:\n%s\nActual:\n%s\n' "$expected" "$actual" >&2
            exit 1
          fi
          for file in "$archive" "$checksum"; do
            test -f "build/distributions/$file"
            test ! -L "build/distributions/$file"
          done
          (
            cd build/distributions
            sha256sum --check "$checksum"
          )
      - name: Resolve and verify the signing toolchain before exposing secrets
        run: >-
          ./gradlew --dependency-verification=strict --no-daemon
          verifySignPluginIsolation dependencies
          --configuration marketplaceZipSigner
      - name: Sign and verify exact release ZIP
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          mkdir -p build/signing
          printf '%s' "$CERTIFICATE_CHAIN" | base64 --decode > build/signing/chain.crt
          printf '%s' "$PRIVATE_KEY" | base64 --decode > build/signing/private.pem
          chmod 600 build/signing/chain.crt build/signing/private.pem
          ./gradlew --offline --dependency-verification=strict --no-daemon signPlugin verifyPluginSignature
      - name: Remove ephemeral signing material
        if: always()
        run: rm -f build/signing/chain.crt build/signing/private.pem
      - name: Locate and checksum verified signed ZIP
        id: signed-archive
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail

          archive="$(scripts/validate-release.sh archive "$RELEASE_VERSION" signed)"
          checksum="${archive}.sha256"
          (
            cd "$(dirname "$archive")"
            sha256sum "$(basename "$archive")" > "$(basename "$checksum")"
            sha256sum --check "$(basename "$checksum")"
          )
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
      - name: Attest signed release files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ steps.signed-archive.outputs.archive }}
            ${{ steps.signed-archive.outputs.checksum }}
      - name: Upload downloadable signed release ZIP
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: alarm-and-timer-${{ needs.build.outputs.version }}
          path: |
            ${{ steps.signed-archive.outputs.archive }}
            ${{ steps.signed-archive.outputs.checksum }}
          if-no-files-found: error
          retention-days: 90

  release:
    needs: [build, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download exact signed release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: alarm-and-timer-${{ needs.build.outputs.version }}
          path: build/release-assets
      - name: Create, verify, and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: 1
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail

          asset_directory="build/release-assets"
          archive_name="jetbrains-${RELEASE_VERSION}-signed.zip"
          checksum_name="${archive_name}.sha256"
          archive="${asset_directory}/${archive_name}"
          checksum="${asset_directory}/${checksum_name}"
          expected_assets="$(printf '%s\n' "$archive_name" "$checksum_name" | LC_ALL=C sort)"
          actual_assets="$(find "$asset_directory" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)"

          if [[ "$actual_assets" != "$expected_assets" ]]; then
            echo "Release input must contain exactly the signed ZIP and its checksum." >&2
            printf 'Expected:\n%s\nActual:\n%s\n' "$expected_assets" "$actual_assets" >&2
            exit 1
          fi
          for file in "$archive" "$checksum"; do
            test -f "$file"
            test ! -L "$file"
          done
          (
            cd "$asset_directory"
            sha256sum --check "$checksum_name"
          )

          notes="build/github-release-notes.md"
          awk -v heading="## Release notes for ${RELEASE_VERSION}" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' README.md > "$notes"
          grep -Eq '[^[:space:]]' "$notes"

          if release_is_draft="$(gh release view "$RELEASE_VERSION" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [[ "$release_is_draft" != "true" && "$release_is_draft" != "false" ]]; then
              echo "Unexpected GitHub release state: $release_is_draft" >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_VERSION" \
              --verify-tag \
              --draft \
              --title "Alarm & Timer ${RELEASE_VERSION}" \
              --notes-file "$notes"
            release_is_draft=true
          fi

          if [[ "$release_is_draft" == "true" ]]; then
            gh release edit "$RELEASE_VERSION" \
              --draft \
              --verify-tag \
              --title "Alarm & Timer ${RELEASE_VERSION}" \
              --notes-file "$notes"
            gh release upload "$RELEASE_VERSION" "$archive" "$checksum" --clobber
          fi

          remote_assets="$(gh release view "$RELEASE_VERSION" --json assets --jq '.assets[].name' | LC_ALL=C sort)"
          if [[ "$remote_assets" != "$expected_assets" ]]; then
            echo "GitHub release must contain exactly the signed ZIP and its checksum." >&2
            printf 'Expected:\n%s\nActual:\n%s\n' "$expected_assets" "$remote_assets" >&2
            exit 1
          fi

          downloaded="build/downloaded-release-assets"
          mkdir -p "$downloaded"
          gh release download "$RELEASE_VERSION" \
            --dir "$downloaded" \
            --pattern "$archive_name" \
            --pattern "$checksum_name"
          cmp -s "$archive" "$downloaded/$archive_name"
          cmp -s "$checksum" "$downloaded/$checksum_name"
          (
            cd "$downloaded"
            sha256sum --check "$checksum_name"
          )

          if [[ "$release_is_draft" == "true" ]]; then
            gh release edit "$RELEASE_VERSION" --draft=false --latest
          fi
